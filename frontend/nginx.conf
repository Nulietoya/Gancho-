# ETAPA 35 — `try_files ... /index.html` é o que faz rotas do
# `react-router-dom` (ex. /tarefas, /observando) funcionarem com F5 ou
# link direto: sem isso, o nginx procuraria um arquivo físico
# "/tarefas" no disco e devolveria 404 — toda rota que não é um
# arquivo estático real cai de volta pro `index.html`, e o React
# Router decide o que renderizar a partir da URL no browser.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash no nome (Vite já versiona `dist/assets/*`) podem
    # ser cacheados por muito tempo sem risco de servir versão velha.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
